[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shellless-ops-session"
version = "0.0.1"
description = "Experimental local Python execution sessions with bounded failure inspection"
requires-python = ">=3.11"
dependencies = ["jupyter-client>=8.10,<9", "ipykernel>=7.4,<8"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
shellless-ops-session = "shellless_ops_session.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
